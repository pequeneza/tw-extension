<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xBot License Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #f4f4f5;
      --surface: #ffffff;
      --border:  #e4e4e7;
      --text:    #18181b;
      --muted:   #71717a;
      --accent:  #18181b;
      --green:   #16a34a;
      --red:     #dc2626;
      --radius:  8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Login screen ── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px 32px;
      width: 320px;
      box-shadow: 0 4px 24px rgba(0,0,0,.07);
    }
    .login-logo { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 6px; }
    .login-sub  { font-size: 12px; color: var(--muted); margin-bottom: 28px; }
    .login-card .field { margin-bottom: 12px; }
    .login-card .field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
    .login-card .field input {
      width: 100%; padding: 9px 11px;
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 14px; font-family: inherit;
      outline: none; background: var(--bg);
    }
    .login-card .field input:focus { border-color: #a1a1aa; background: #fff; }
    .login-btn {
      width: 100%; padding: 9px;
      background: var(--accent); color: #fff;
      border: none; border-radius: 6px;
      font-size: 14px; font-weight: 600;
      cursor: pointer; margin-top: 4px;
      transition: opacity .15s;
    }
    .login-btn:hover { opacity: .85; }
    .login-error { font-size: 12px; color: var(--red); margin-top: 10px; text-align: center; min-height: 18px; }

    /* ── App ── */
    #app { display: none; }

    /* ── Header ── */
    header {
      background: var(--accent);
      color: #fff;
      padding: 0 32px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { font-size: 15px; font-weight: 600; letter-spacing: -.02em; }
    .logo span { opacity: .5; font-weight: 400; margin-left: 8px; font-size: 13px; }
    .logout-btn {
      background: rgba(255,255,255,.15); color: #fff;
      border: none; border-radius: 5px;
      padding: 5px 12px; font-size: 12px;
      cursor: pointer; transition: background .15s;
    }
    .logout-btn:hover { background: rgba(255,255,255,.25); }

    /* ── Layout ── */
    main { max-width: 900px; margin: 0 auto; padding: 32px 20px; }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
    }
    .stat-card .value { font-size: 28px; font-weight: 700; line-height: 1; }
    .stat-card .label { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .stat-card.green .value { color: var(--green); }
    .stat-card.red   .value { color: var(--red); }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .toolbar h2 { font-size: 15px; font-weight: 600; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: opacity .15s;
    }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn-primary  { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { opacity: .85; }
    .btn-ghost    { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { background: var(--bg); color: var(--text); }
    .btn-danger   { background: transparent; color: var(--red); border: 1px solid #fca5a5; }
    .btn-danger:hover:not(:disabled) { background: #fef2f2; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* ── Table ── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left;
      padding: 11px 16px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: #fafafa;
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafafa; }
    td { padding: 11px 16px; vertical-align: middle; }
    .key-cell  { font-family: monospace; font-size: 13px; letter-spacing: .04em; }
    .note-cell { color: var(--muted); font-size: 12px; max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .date-cell { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .actions-cell { display: flex; gap: 6px; align-items: center; }

    /* ── Badge ── */
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 500; }
    .badge::before { content: ''; display: block; width: 6px; height: 6px; border-radius: 50%; }
    .badge-active  { background: #dcfce7; color: #15803d; }
    .badge-active::before  { background: var(--green); }
    .badge-revoked { background: #fee2e2; color: #b91c1c; }
    .badge-revoked::before { background: var(--red); }
    .badge-expired { background: #fef3c7; color: #b45309; }
    .badge-expired::before { background: #f59e0b; }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty .icon { font-size: 36px; margin-bottom: 12px; }
    .empty p { font-size: 13px; }

    /* ── Modal ── */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 12px;
      padding: 28px;
      width: 420px;
      max-width: calc(100vw - 32px);
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 20px; }

    /* ── Form ── */
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 5px; }
    .field input, .field textarea {
      width: 100%; padding: 8px 10px;
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 13px; font-family: inherit;
      color: var(--text); background: var(--bg); outline: none;
      transition: border-color .15s;
    }
    .field input:focus, .field textarea:focus { border-color: #a1a1aa; background: #fff; }
    .field textarea { resize: vertical; min-height: 60px; }

    /* ── Generated key ── */
    .key-result {
      display: none;
      background: #f0fdf4; border: 1px solid #86efac;
      border-radius: 8px; padding: 16px; margin-bottom: 20px; text-align: center;
    }
    .key-result.show { display: block; }
    .key-result .label { font-size: 11px; color: var(--green); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
    .key-result .key  { font-family: monospace; font-size: 20px; font-weight: 700; letter-spacing: .08em; color: #15803d; margin-bottom: 10px; }
    .copy-btn {
      background: var(--green); color: #fff;
      border: none; border-radius: 5px;
      padding: 5px 14px; font-size: 12px; font-weight: 500;
      cursor: pointer; transition: opacity .15s;
    }
    .copy-btn:hover { opacity: .85; }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #18181b; color: #fff;
      padding: 9px 18px; border-radius: 8px;
      font-size: 13px; font-weight: 500;
      opacity: 0; transition: opacity .2s;
      pointer-events: none; z-index: 200; white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* ── Search ── */
    .search-input {
      padding: 7px 12px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px; outline: none;
      width: 200px; background: var(--surface);
    }
    .search-input:focus { border-color: #a1a1aa; }
  </style>
</head>
<body>

<!-- ── Login ── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">⚡ xBot</div>
    <div class="login-sub">License Manager</div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="login-user" value="admin" autocomplete="username" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="login-btn" onclick="login()">Sign in</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ── App ── -->
<div id="app">
  <header>
    <div class="logo">⚡ xBot <span>License Manager</span></div>
    <button class="logout-btn" onclick="logout()">Sign out</button>
  </header>

  <main>
    <div class="stats" style="grid-template-columns:repeat(4,1fr)">
      <div class="stat-card green">
        <div class="value" id="stat-active">—</div>
        <div class="label">Active keys</div>
      </div>
      <div class="stat-card red">
        <div class="value" id="stat-revoked">—</div>
        <div class="label">Revoked keys</div>
      </div>
      <div class="stat-card" style="--value-color:#b45309">
        <div class="value" id="stat-expired" style="color:#b45309">—</div>
        <div class="label">Expired keys</div>
      </div>
      <div class="stat-card">
        <div class="value" id="stat-total">—</div>
        <div class="label">Total issued</div>
      </div>
    </div>

    <div class="toolbar">
      <h2>License Keys</h2>
      <div style="display:flex;gap:10px;align-items:center;">
        <input class="search-input" type="text" id="search" placeholder="Search name, note or key…" />
        <button class="btn btn-primary" onclick="openModal()">+ Generate Key</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Key</th>
            <th>Name</th>
            <th>Note</th>
            <th>Created</th>
            <th>Expires</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="7"><div class="empty"><div class="icon">🔑</div><p>Loading…</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- Generate Key Modal -->
<div class="overlay" id="modal" onclick="onOverlayClick(event)">
  <div class="modal">
    <h3>Generate License Key</h3>
    <div class="key-result" id="key-result">
      <div class="label">Key generated — send this to the user</div>
      <div class="key" id="generated-key"></div>
      <button class="copy-btn" onclick="copyKey()">Copy</button>
    </div>
    <div id="form-fields">
      <div class="field">
        <label>Name / Username</label>
        <input type="text" id="input-name" placeholder="e.g. player123" autocomplete="off" />
      </div>
      <div class="field">
        <label>Note</label>
        <textarea id="input-note" placeholder="e.g. paid 10€ cash 2026-04-30"></textarea>
      </div>
      <div class="field">
        <label>Expiry</label>
        <select id="input-duration" onchange="onDurationChange()" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:var(--bg);outline:none;">
          <option value="">No expiry (permanent)</option>
          <option value="1m">1 month</option>
          <option value="3m">3 months</option>
          <option value="6m">6 months</option>
          <option value="1y">1 year</option>
          <option value="custom">Custom date…</option>
        </select>
      </div>
      <div class="field" id="custom-date-field" style="display:none">
        <label>Specific date</label>
        <input type="date" id="input-expires-at" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
      <button class="btn btn-primary" id="gen-btn" onclick="generateKey()">Generate</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── Auth ──────────────────────────────────────────────────────────────────
  let authHeader = sessionStorage.getItem('xbot_auth') ?? '';

  function login() {
    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value;
    if (!user || !pass) { showLoginError('Enter username and password'); return; }
    authHeader = 'Basic ' + btoa(user + ':' + pass);
    // Test credentials before showing the app
    fetch('/admin/stats', { headers: { Authorization: authHeader } }).then(res => {
      if (res.status === 401 || res.status === 403) {
        authHeader = '';
        showLoginError('Invalid credentials');
      } else {
        sessionStorage.setItem('xbot_auth', authHeader);
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        load();
      }
    }).catch(() => showLoginError('Cannot reach server'));
  }

  function logout() {
    authHeader = '';
    sessionStorage.removeItem('xbot_auth');
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('login-pass').value = '';
  }

  function showLoginError(msg) {
    document.getElementById('login-error').textContent = msg;
    setTimeout(() => document.getElementById('login-error').textContent = '', 3000);
  }

  // Auto-login if session has credentials
  if (authHeader) {
    fetch('/admin/stats', { headers: { Authorization: authHeader } }).then(res => {
      if (res.ok) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        load();
      } else {
        sessionStorage.removeItem('xbot_auth');
        authHeader = '';
      }
    });
  }

  document.getElementById('login-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  // ── API ───────────────────────────────────────────────────────────────────
  let allKeys = [];
  let searchTerm = '';

  async function apiFetch(path, opts = {}) {
    const res = await fetch(path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', 'Authorization': authHeader, ...(opts.headers ?? {}) },
    });
    if (res.status === 401 || res.status === 403) { logout(); return null; }
    return res.json();
  }

  async function load() {
    const [keys, stats] = await Promise.all([
      apiFetch('/admin/keys'),
      apiFetch('/admin/stats'),
    ]);
    if (!keys || !stats) return;
    allKeys = keys;
    document.getElementById('stat-active').textContent  = stats.active  ?? 0;
    document.getElementById('stat-revoked').textContent = stats.revoked ?? 0;
    document.getElementById('stat-expired').textContent = stats.expired ?? 0;
    document.getElementById('stat-total').textContent   = (stats.active ?? 0) + (stats.revoked ?? 0) + (stats.expired ?? 0);
    renderTable();
  }

  // ── Table ─────────────────────────────────────────────────────────────────
  function renderTable() {
    const tbody = document.getElementById('table-body');
    const term  = searchTerm.toLowerCase();
    const rows  = allKeys.filter(r =>
      !term ||
      r.key.toLowerCase().includes(term) ||
      r.name.toLowerCase().includes(term) ||
      r.note.toLowerCase().includes(term)
    );

    if (rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty"><div class="icon">🔑</div><p>No keys found.</p></div></td></tr>`;
      return;
    }

    const today = new Date().toISOString().slice(0, 10);
    tbody.innerHTML = rows.map(r => {
      const expired = r.active && r.expires_at && r.expires_at <= today;
      const badgeClass = !r.active ? 'badge-revoked' : expired ? 'badge-expired' : 'badge-active';
      const badgeLabel = !r.active ? 'Revoked' : expired ? 'Expired' : 'Active';
      const expiryCell = r.expires_at
        ? `<span style="color:${r.expires_at <= today ? 'var(--red)' : 'inherit'}">${formatDate(r.expires_at)}</span>`
        : '<span style="color:var(--muted)">Never</span>';
      return `
        <tr>
          <td class="key-cell">${r.key}</td>
          <td>${esc(r.name) || '<span style="color:var(--muted)">—</span>'}</td>
          <td class="note-cell" title="${esc(r.note)}">${esc(r.note) || '—'}</td>
          <td class="date-cell">${formatDate(r.created_at)}</td>
          <td class="date-cell">${expiryCell}</td>
          <td><span class="badge ${badgeClass}">${badgeLabel}</span></td>
          <td class="actions-cell">
            <button class="btn btn-ghost btn-sm" onclick="toggleKey('${r.key}', ${r.active})">${r.active ? 'Revoke' : 'Restore'}</button>
            <button class="btn btn-danger btn-sm" onclick="deleteKey('${r.key}')">Delete</button>
          </td>
        </tr>`;
    }).join('');
  }

  // ── Actions ───────────────────────────────────────────────────────────────
  async function toggleKey(key, currentlyActive) {
    if (!confirm(`${currentlyActive ? 'Revoke' : 'Restore'} key ${key}?`)) return;
    await apiFetch(`/admin/keys/${key}`, { method: 'PATCH', body: JSON.stringify({ active: !currentlyActive }) });
    toast(`Key ${currentlyActive ? 'revoked' : 'restored'}`);
    load();
  }

  async function deleteKey(key) {
    if (!confirm(`Permanently delete key ${key}?\n\nThis cannot be undone.`)) return;
    await apiFetch(`/admin/keys/${key}`, { method: 'DELETE' });
    toast('Key deleted');
    load();
  }

  // ── Modal ─────────────────────────────────────────────────────────────────
  let lastGeneratedKey = '';

  function openModal() {
    document.getElementById('modal').classList.add('open');
    document.getElementById('key-result').classList.remove('show');
    document.getElementById('form-fields').style.display = 'block';
    document.getElementById('gen-btn').style.display = 'inline-flex';
    document.getElementById('input-name').value = '';
    document.getElementById('input-note').value = '';
    document.getElementById('input-duration').value = '';
    document.getElementById('input-expires-at').value = '';
    document.getElementById('custom-date-field').style.display = 'none';
    document.getElementById('input-name').focus();
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    if (lastGeneratedKey) load();
    lastGeneratedKey = '';
  }

  function onOverlayClick(e) {
    if (e.target === document.getElementById('modal')) closeModal();
  }

  async function generateKey() {
    const name = document.getElementById('input-name').value.trim();
    const note = document.getElementById('input-note').value.trim();
    const btn  = document.getElementById('gen-btn');
    btn.disabled = true;
    btn.textContent = 'Generating…';

    const duration   = document.getElementById('input-duration').value;
    const expires_at = duration === 'custom' ? document.getElementById('input-expires-at').value : undefined;
    const body = { name, note };
    if (duration && duration !== 'custom') body.duration = duration;
    if (expires_at) body.expires_at = expires_at;
    const data = await apiFetch('/admin/keys', { method: 'POST', body: JSON.stringify(body) });

    btn.disabled = false;
    btn.textContent = 'Generate';
    if (!data?.key) { toast('Error generating key'); return; }

    lastGeneratedKey = data.key;
    const expiryNote = data.expires_at ? ` · Expires ${formatDate(data.expires_at)}` : '';
    document.getElementById('generated-key').textContent = data.key;
    document.querySelector('#key-result .label').textContent = `Key generated — send this to the user${expiryNote}`;
    document.getElementById('key-result').classList.add('show');
    document.getElementById('form-fields').style.display = 'none';
    document.getElementById('gen-btn').style.display = 'none';
  }

  function onDurationChange() {
    const isCustom = document.getElementById('input-duration').value === 'custom';
    document.getElementById('custom-date-field').style.display = isCustom ? 'block' : 'none';
  }

  function copyKey() {
    navigator.clipboard.writeText(lastGeneratedKey).then(() => toast('Copied to clipboard'));
  }

  // ── Search ────────────────────────────────────────────────────────────────
  document.getElementById('search').addEventListener('input', e => {
    searchTerm = e.target.value;
    renderTable();
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ── Utils ─────────────────────────────────────────────────────────────────
  function esc(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatDate(iso) {
    if (!iso) return '—';
    return new Date(iso + 'Z').toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  }

  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }
</script>
</body>
</html>
